name: Build Signed IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup iOS Keychain and Provisioning
        run: |
          # 1. 创建并解锁钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 将自定义钥匙串加入搜索列表
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/\"//g')
          
          # 2. 导入 P12 证书
          security import "证书文件.p12" -P "1" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 调试：输出可用的身份
          security find-identity -p codesigning -v
          
          # 3. 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "描述文件.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate ExportOptions.plist
        run: |
          # 动态提取描述文件的 UUID
          PROFILE_UUID=$(grep UUID -A1 -a "描述文件.mobileprovision" | grep -io "[-A-Z0-9]\{36\}")
          echo "Using Provisioning Profile UUID: $PROFILE_UUID"
          
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>3C474Y34QB</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.moontechlab.selene</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Build Unsigned Archive
        run: flutter build ipa --release --no-codesign

      - name: Export and Sign IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selene-Signed-IPA
          path: build/ios/ipa/*.ipa

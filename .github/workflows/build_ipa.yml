name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Code Signing
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [A-Za-z0-9-]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;//g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build IPA (No codesign)
        run: flutter build ipa --release --no-codesign
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""


      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          else
            cp -R build/ios/iphoneos/Runner.app Payload/
          fi
          zip -r Selene_unsigned.ipa Payload


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selene-Unsigned-IPA
          path: Selene_unsigned.ipa

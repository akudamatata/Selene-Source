name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix libarclite (Xcode 14+)
        run: |
          XCODE_PATH=$(xcode-select -p)
          ARC_DIR="${XCODE_PATH}/Toolchains/XcodeDefault.xctoolchain/usr/lib/arc"
          if [ ! -f "$ARC_DIR/libarclite_iphoneos.a" ]; then
            sudo mkdir -p "$ARC_DIR"
            echo "void dummy_arclite(void) {}" > dummy.c
            clang -c dummy.c -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=13.0 -o dummy_os_arm64.o
            libtool -static -o libarclite_iphoneos.a dummy_os_arm64.o
            sudo cp libarclite_iphoneos.a "$ARC_DIR/"
            rm dummy.c dummy_os_arm64.o libarclite_iphoneos.a
          fi

      - name: Build Unsigned App
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --config-only
          
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Selene_unsigned.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Selene-Unsigned-IPA
          path: Selene_unsigned.ipa
